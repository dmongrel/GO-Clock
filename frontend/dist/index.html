<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clock</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="shell">
    <div id="left">
      <div id="clock-area">
        <div id="face"></div>
        <div id="extras">
          <span id="ampm" class="readout">AM</span>
          <span id="indicator24" class="readout">24H</span>
          <span id="timezone" class="readout"></span>
          <span id="alarm-icon" class="icon" title="Alarm set"></span>
        </div>
      </div>
      <button id="snooze" type="button">Snooze</button>
    </div>

    <div id="sidebar">
      <label><input type="checkbox" id="mode24h" /> 24-Hour Mode</label>
      <label><input type="checkbox" id="showSeconds" /> Show Seconds</label>
      <label><input type="checkbox" id="alarmEnabled" /> Alarm Enabled</label>
      <button id="setAlarm" type="button">Set Alarm</button>
      <button id="openSettings" class="icon-button" type="button" title="Settings"></button>
    </div>
  </div>

  <!-- Deliberately worded as a failure: main.js clears this on load, so if you
       can still read it, main.js did not run. -->
  <p id="shell-check">main.js did not run.</p>

  <!-- type="module" is required, not optional: a dev build serves
       runtime.debug.js, which ends in an export statement and throws
       "Unexpected token 'export'" in a classic script tag, leaving
       window._wails undefined. The production runtime is a plain IIFE and loads
       either way, so module is the form that works for both. -->
  <script type="module" src="/wails/runtime.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
