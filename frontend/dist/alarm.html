<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set Alarm</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dialog-window">
  <main id="set-alarm">
    <p class="field-label">Select Alarm Time</p>
    <div class="time-row">
      <select id="alarm-hour" aria-label="hour"></select>
      <span>:</span>
      <select id="alarm-minute" aria-label="minute"></select>
      <select id="alarm-ampm" aria-label="AM or PM">
        <option>AM</option>
        <option>PM</option>
      </select>
    </div>

    <p class="field-label">Select Snooze Time</p>
    <select id="alarm-snooze" aria-label="snooze minutes">
      <option>5</option>
      <option>10</option>
      <option>15</option>
      <option>30</option>
      <option>60</option>
    </select>
  </main>

  <div class="dialog-buttons window-footer">
    <button id="alarm-save" type="button">Save</button>
    <button id="alarm-cancel" type="button">Cancel</button>
  </div>

  <script type="module" src="/wails/runtime.js"></script>
  <script type="module" src="alarmwindow.js"></script>
</body>
</html>
